global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'device']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 5m
  receiver: 'telemetry-api-webhook'

receivers:
  - name: 'telemetry-api-webhook'
    webhook_configs:
      - url: 'http://telemetry-api:8000/alert'
        send_resolved: true
        http_config:
          follow_redirects: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'device']
